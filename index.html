<!DOCTYPE html>  <html lang="pt-BR">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>RL Instalações</title>  <style>  
  
*{  
margin:0;  
padding:0;  
box-sizing:border-box;  
font-family:Arial,Helvetica,sans-serif;  
}  
  
body{  
background:#111827;  
color:white;  
}  
  
#login{  
height:100vh;  
display:flex;  
justify-content:center;  
align-items:center;  
padding:20px;  
}  
  
.card{  
width:100%;  
max-width:380px;  
background:#1f2937;  
padding:25px;  
border-radius:18px;  
box-shadow:0 0 25px rgba(0,0,0,.4);  
}  
  
.logo{  
font-size:30px;  
font-weight:bold;  
text-align:center;  
color:#22c55e;  
margin-bottom:10px;  
}  
  
.sub{  
text-align:center;  
color:#bbb;  
margin-bottom:25px;  
}  
  
input{  
width:100%;  
padding:14px;  
margin-bottom:15px;  
border:none;  
border-radius:10px;  
background:#374151;  
color:white;  
font-size:16px;  
}  
  
button{  
width:100%;  
padding:14px;  
border:none;  
border-radius:10px;  
font-size:16px;  
font-weight:bold;  
cursor:pointer;  
}  
  
#entrar{  
background:#22c55e;  
color:white;  
}  
  
#erro{  
margin-top:15px;  
text-align:center;  
color:#ef4444;  
display:none;  
}  
  
#app{  
display:none;  
padding:15px;  
}  
  
header{  
background:#1f2937;  
padding:18px;  
border-radius:15px;  
margin-bottom:20px;  
box-shadow:0 0 15px rgba(0,0,0,.3);  
}  
  
header h1{  
font-size:25px;  
}  
  
header p{  
color:#cbd5e1;  
margin-top:5px;  
}  
  
.barra{  
height:18px;  
background:#374151;  
border-radius:20px;  
margin-top:15px;  
overflow:hidden;  
}  
  
.progresso{  
height:100%;  
width:0%;  
background:#22c55e;  
transition:.5s;  
}  
  
#textoProgresso{  
margin-top:10px;  
font-size:14px;  
}  
  
.ap{  
background:#1f2937;  
padding:15px;  
border-radius:15px;  
margin-bottom:12px;  
display:flex;  
justify-content:space-between;  
align-items:center;  
transition:.4s;  
box-shadow:0 0 10px rgba(0,0,0,.2);  
}  
  
.ap.feito{  
background:#166534;  
}  
  
.info h3{  
margin-bottom:5px;  
}  
  
.info span{  
color:#d1d5db;  
font-size:14px;  
}  
  
.botoes{  
display:flex;  
gap:8px;  
}  
  
.feitoBtn{  
background:#22c55e;  
color:white;  
padding:10px 14px;  
border:none;  
border-radius:8px;  
}  
  
.desfazerBtn{  
background:#ef4444;  
color:white;  
padding:10px 14px;  
border:none;  
border-radius:8px;  
}  
  
#salvar{  
position:fixed;  
bottom:20px;  
right:20px;  
width:auto;  
padding:15px 22px;  
background:#2563eb;  
border-radius:50px;  
color:white;  
font-weight:bold;  
box-shadow:0 0 15px rgba(0,0,0,.4);  
}  
  
#sair{  
margin-top:15px;  
background:#ef4444;  
}  
  
#ultima{  
margin-top:20px;  
text-align:center;  
color:#9ca3af;  
font-size:13px;  
}  
  
</style>  </head>  <body>  <div id="login">  <div class="card">  <div class="logo">  
RL Instalações  
</div>  <div class="sub">  
Controle de Cronograma  
</div>  <input  
type="text"  
id="usuario"  
placeholder="Usuário">

<input  
type="password"  
id="senha"  
placeholder="Senha">

<button id="entrar">  
Entrar  
</button>  <div id="erro">  
Usuário ou senha inválidos.  
</div>  </div>  </div>  <div id="app">  <header>  <h1>RL Instalações</h1>  <p id="nomeUsuario"></p>  <div class="barra">  
<div class="progresso" id="barra"></div>  
</div>  <p id="textoProgresso">  
0 de 10 apartamentos concluídos  
</p>  </header>  <div id="listaApartamentos"></div>  <button id="salvar">  
💾 Salvar  
</button>  <button id="sair">  
Sair  
</button>  <div id="ultima"></div>  </div>  <script>  
  
let usuarioLogado="";  
  
let apartamentos=JSON.parse(localStorage.getItem("apartamentos"))||[  
false,false,false,false,false,  
false,false,false,false,false  
];  
  
let ultimaAtualizacao=localStorage.getItem("ultima")||"Nunca";  
  
const lista=document.getElementById("listaApartamentos");  
const barra=document.getElementById("barra");  
const   
texto=document.getElementById("textoProgresso");  
  function atualizarTela(){  
  
lista.innerHTML="";  
  
let concluidos=0;  
  
apartamentos.forEach((feito,index)=>{  
  
if(feito) concluidos++;  
  
let card=document.createElement("div");  
card.className="ap";  
  
if(feito){  
card.classList.add("feito");  
}  
  
let status=feito?"🟢 Concluído":"⏳ Pendente";  
  
card.innerHTML=`  
<div class="info">  
<h3>Apartamento ${(index+1).toString().padStart(2,"0")}</h3>  
<span>${status}</span>  
</div>  
`;  
  
if(usuarioLogado==="admin"){  
  
let botoes=document.createElement("div");  
botoes.className="botoes";  
  
let feitoBtn=document.createElement("button");  
feitoBtn.className="feitoBtn";  
feitoBtn.textContent="Feito";  
  
feitoBtn.onclick=function(){  
apartamentos[index]=true;  
atualizarTela();  
};  
  
let desfazerBtn=document.createElement("button");  
desfazerBtn.className="desfazerBtn";  
desfazerBtn.textContent="Desfazer";  
  
desfazerBtn.onclick=function(){  
apartamentos[index]=false;  
atualizarTela();  
};  
  
botoes.appendChild(feitoBtn);  
botoes.appendChild(desfazerBtn);  
  
card.appendChild(botoes);  
  
}  
  
lista.appendChild(card);  
  
});  
  
let porcentagem=(concluidos/apartamentos.length)*100;  
  
barra.style.width=porcentagem+"%";  
  
texto.innerHTML=  
concluidos+  
" de "+  
apartamentos.length+  
" apartamentos concluídos";  
  
document.getElementById("ultima").innerHTML=  
"Última atualização: "+ultimaAtualizacao;  
  
}  
  
document.getElementById("entrar").onclick=function(){  
  
let usuario=document.getElementById("usuario").value.trim();  
let senha=document.getElementById("senha").value;  
  
if(usuario==="Nelson" && senha==="Nelson1"){  
  
usuarioLogado="admin";  
  
document.getElementById("nomeUsuario").innerHTML=  
"Administrador • Nelson";  
  
document.getElementById("login").style.display="none";  
document.getElementById("app").style.display="block";  
  
document.getElementById("salvar").style.display="block";  
  
atualizarTela();  
  
return;  
  
}  
  
if(usuario==="Rafaela" && senha==="RL Instalações"){  
  
usuarioLogado="visitante";  
  
document.getElementById("nomeUsuario").innerHTML=  
"Visitante • Rafaela";  
  
document.getElementById("login").style.display="none";  
document.getElementById("app").style.display="block";  
  
document.getElementById("salvar").style.display="none";  
  
atualizarTela();  
  
return;  
  
}  
  
document.getElementById("erro").style.display="block";  
  
};  
  
document.getElementById("sair").onclick=function(){  
  
location.reload();  
  
};  
    
document.getElementById("salvar").onclick=function(){  
  
localStorage.setItem(  
"apartamentos",  
JSON.stringify(apartamentos)  
);  
  
let agora=new Date();  
  
let dia=String(agora.getDate()).padStart(2,"0");  
let mes=String(agora.getMonth()+1).padStart(2,"0");  
let ano=agora.getFullYear();  
  
let hora=String(agora.getHours()).padStart(2,"0");  
let minuto=String(agora.getMinutes()).padStart(2,"0");  
  
ultimaAtualizacao=  
dia+"/"+mes+"/"+ano+  
" às "+  
hora+":"+minuto;  
  
localStorage.setItem(  
"ultima",  
ultimaAtualizacao  
);  
  
atualizarTela();  
  
alert("Cronograma salvo com sucesso!");  
  
};  
  
atualizarTela();  
  
</script>  </body>  
</html>
